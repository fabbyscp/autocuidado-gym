
name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autocuidado_gym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DATABASE: autocuidado_gym
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar banco de testes
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE autocuidado_gym_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d autocuidado_gym_test -c "CREATE TABLE exercicios (id SERIAL PRIMARY KEY, nome VARCHAR(100) NOT NULL, series INTEGER, repeticoes INTEGER, carga NUMERIC);"
          PGPASSWORD=postgres psql -h localhost -U postgres -d autocuidado_gym_test -c "CREATE TABLE usuarios (id SERIAL PRIMARY KEY, email VARCHAR(255) UNIQUE NOT NULL, senha_hash VARCHAR(255) NOT NULL);"

      - name: Executar testes
        run: pytest
